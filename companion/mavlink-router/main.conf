# mavlink-router config for MOLE (Pi companion computer <-> TBS Lucid H7)
# Docs: https://github.com/mavlink-router/mavlink-router/blob/master/examples/config.sample

[General]
# TCP server on all interfaces: local scripts and a laptop GCS connect here
TcpServerPort = 5760
ReportStats = false
MavlinkDialect = auto

# Flight logs: the FC streams its dataflash log over MAVLink (FC side:
# LOG_BACKEND_TYPE=2) and mavlink-router saves one .bin per arming in Log.
# The FC has no SD card, so this is the only copy of the flight log.
Log = /home/molepi/logs
LogMode = while-armed
# Delete the oldest logs to keep 2 GB free on the SD card
MinFreeSpace = 2000000000

# Flight controller on the GPIO UART (pins 8/10). FC side: SERIAL7_PROTOCOL=2, SERIAL7_BAUD=921
[UartEndpoint fc]
Device = /dev/serial0
Baud = 921600
