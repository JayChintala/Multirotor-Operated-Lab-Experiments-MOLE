# mavlink-router config for MOLE (Pi companion computer <-> TBS Lucid H7)
# Docs: https://github.com/mavlink-router/mavlink-router/blob/master/examples/config.sample

[General]
# TCP server on all interfaces: local scripts and a laptop GCS connect here
TcpServerPort = 5760
ReportStats = false
MavlinkDialect = auto

# Flight controller on the GPIO UART (pins 8/10). FC side: SERIAL7_PROTOCOL=2, SERIAL7_BAUD=921
[UartEndpoint fc]
Device = /dev/serial0
Baud = 921600
